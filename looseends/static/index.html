<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LooseEnds</title>
<meta name="description" content="Find decisions that changed while the work built on them didn't, promises that passed, and work whose owners went quiet.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='11' cy='16' r='6' fill='none' stroke='%231d2a6b' stroke-width='3'/%3E%3Cpath d='M17 16c4 0 4-6 9-6' fill='none' stroke='%23a82341' stroke-width='3' stroke-linecap='round' stroke-dasharray='3 3'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="top">
  <a class="mark" href="/" aria-label="LooseEnds home">
    <svg viewBox="0 0 40 24" aria-hidden="true"><circle cx="10" cy="12" r="7" class="knot"/><path d="M17 12c6 0 6-7 13-7 4 0 6 2 8 3" class="fray"/></svg>
    <span>LooseEnds</span>
  </a>
  <p class="status" id="status">Reading the graph…</p>
  <form class="search" id="search" role="search">
    <label for="q" class="sr">Find a decision</label>
    <input id="q" name="q" type="search" placeholder="Find a decision by number or topic" autocomplete="off">
    <ul id="results" class="results" role="listbox" hidden></ul>
  </form>
</header>

<main class="layout">
  <nav class="rail" aria-label="Loose ends">
    <div class="tabs" role="tablist" id="kinds">
      <button role="tab" data-kind="stale" aria-selected="true"><span class="sw stale"></span>Resting on retired <b id="n-stale"></b></button>
      <button role="tab" data-kind="broken_promises" aria-selected="false"><span class="sw late"></span>Missed targets <b id="n-broken_promises"></b></button>
      <button role="tab" data-kind="orphans" aria-selected="false"><span class="sw quiet"></span>Owners gone quiet <b id="n-orphans"></b></button>
    </div>
    <p class="explain" id="explain"></p>
    <ol class="items" id="items"></ol>
  </nav>

  <section class="stage" aria-labelledby="stage-title">
    <div class="stage-head">
      <h1 id="stage-title">What depends on this decision</h1>
      <p id="stage-sub"></p>
    </div>
    <div id="cy" class="cy" role="img" aria-label="Graph of decisions linked to the selected one"></div>
    <ul class="legend" aria-label="Legend">
      <li><span class="lg node open"></span>Open</li>
      <li><span class="lg node done"></span>Closed</li>
      <li><span class="lg node retired"></span>Retired</li>
      <li><span class="lg edge dep"></span>Depends on</li>
      <li><span class="lg edge cite"></span>Mentions</li>
      <li><span class="lg edge repl"></span>Replaces</li>
      <li><span class="lg edge sugg"></span>Suggested, unconfirmed</li>
    </ul>
  </section>

  <aside class="panel">
    <div class="tabs panel-tabs" role="tablist" id="panels">
      <button role="tab" data-panel="decision" aria-selected="true">Decision</button>
      <button role="tab" data-panel="ask" aria-selected="false">Ask</button>
      <button role="tab" data-panel="followups" aria-selected="false">Follow-ups <b id="n-fu"></b></button>
      <button role="tab" data-panel="benchmark" aria-selected="false">Benchmark</button>
    </div>

    <section id="p-decision" class="pane" role="tabpanel"></section>

    <section id="p-ask" class="pane" role="tabpanel" hidden>
      <div id="chat" class="chat" aria-live="polite"></div>
      <div class="starters" id="starters">
        <button type="button">What breaks if KEP-583 changes?</button>
        <button type="button">Who can take over KEP-1845?</button>
        <button type="button">Draft a follow-up for KEP-5547</button>
      </div>
      <form id="askform" class="askform">
        <label for="ask" class="sr">Ask LooseEnds</label>
        <textarea id="ask" rows="2" placeholder="Ask about any decision, person or loose end"></textarea>
        <p class="err" id="ask-err" hidden></p>
        <div class="askrow"><span id="mode" class="mode"></span><button type="submit" class="primary">Ask</button></div>
      </form>
    </section>

    <section id="p-followups" class="pane" role="tabpanel" hidden></section>
    <section id="p-benchmark" class="pane" role="tabpanel" hidden></section>
  </aside>
</main>

<script src="/static/vendor/cytoscape.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
